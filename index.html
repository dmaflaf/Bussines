<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEEPER — Herramientas</title>
<style>
  :root{ --ink:#17242b; --sub:#6b7a82; --bg:#f7f5ef; --card:#fff; --border:#efe9db; --kdark:#0c2834; --kgold:#e5903f; --kgold-ink:#1a1205; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .wrap{max-width:420px;width:100%}
  .hero{background:var(--kdark);border-radius:20px;padding:22px 20px 24px;margin-bottom:18px;color:#fff;}
  .hero .logobadge{background:#fff;border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);margin-bottom:14px;}
  .hero .logobadge img{height:26px;display:block;}
  .hero h1{font-size:1.3rem;margin:0 0 4px;font-weight:800;letter-spacing:.2px;}
  .hero p{margin:0;color:rgba(255,255,255,.65);font-size:.86rem;}
  a.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;color:var(--ink);text-decoration:none;box-shadow:0 1px 3px rgba(23,36,43,.08);transition:transform 100ms ease-out;}
  a.card:active{transform:scale(.98);}
  a.card .txt{flex:1;min-width:0;}
  a.card b{display:block;font-size:1.02rem;font-weight:800;margin-bottom:3px;}
  a.card span{color:var(--sub);font-size:.85rem;}
  a.card .arrow{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--kgold);color:var(--kgold-ink);display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;}
</style>
