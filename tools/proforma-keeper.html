<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotizaciones — KEEPER</title>
<style>
  :root{
    --ink:#1a1a1a; --sub:#6b7280; --bg:#f2f3f5; --card:#ffffff; --border:#e3e5e9;
    --red:#b3261e; --red-dark:#7d1a14; --red-bg:#fbe9e7;
    --green:#1e9e6a; --green-bg:#e3f7ee;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f2f3f5; --sub:#aab0bb; --bg:#111318; --card:#1a1d24; --border:#2c3038;
      --red-bg:#3a1512; --green-bg:#0f2c22;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f2f3f5; --sub:#aab0bb; --bg:#111318; --card:#1a1d24; --border:#2c3038;
    --red-bg:#3a1512; --green-bg:#0f2c22;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;}
  button{font:inherit; color:inherit; cursor:pointer;}
  input,select,textarea{font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 10px;}
  textarea{resize:vertical;}

  header.app{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--card); border-bottom:1px solid var(--border); padding:10px 14px;}
  .app-top{display:flex; align-items:center; gap:10px;}
  .app-top img{height:28px;}
  .app-top h1{font-size:1.05rem; margin:0; flex:1; min-width:0;}
  .tabbar{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin-top:10px;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbtn{flex:0 0 auto; height:38px; padding:0 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg); color:var(--ink); font-weight:700; font-size:.82rem;}
  .tabbtn.on{background:var(--red); color:#fff; border-color:transparent;}

  .wrap{max-width:720px; margin:0 auto; padding:16px 14px 80px;}
  .view{display:none;}
  .view.on{display:block;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;}
  .card h2{font-size:.95rem; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .fld{display:block; margin-bottom:12px;}
  .fld label{display:block; font-size:.78rem; color:var(--sub); font-weight:600; margin-bottom:5px;}
  .fld input, .fld select, .fld textarea{width:100%; height:44px;}
  .fld textarea{height:auto; min-height:80px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

  .logo-pick{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .logo-pick img{height:52px; max-width:140px; object-fit:contain; background:#fff; border:1px solid var(--border); border-radius:8px; padding:4px;}
  .logo-pick .btn{height:40px;}

  .btn{border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink); font-weight:700; padding:0 16px; height:44px;}
  .btn.pri{background:var(--red); color:#fff; border-color:transparent;}
  .btn.sm{height:36px; padding:0 12px; font-size:.82rem;}
  .btn.danger{color:#c0392b;}
  .btn.block{width:100%;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}

  .item-card{border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--bg);}
  .item-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .item-head b{font-size:.8rem; color:var(--sub);}
  .item-del{width:32px; height:32px; border-radius:8px; border:0; background:transparent; color:var(--sub); font-size:18px;}
  .item-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .item-grid .full{grid-column:1 / -1;}
  .item-total{text-align:right; font-weight:800; margin-top:6px; font-size:.9rem;}

  .totals{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .totals .t-row{display:flex; justify-content:space-between; padding:5px 0; font-size:.88rem;}
  .totals .t-row.total{border-top:2px solid var(--ink); margin-top:6px; padding-top:10px; font-weight:800; font-size:1.05rem;}
  .totals input{width:110px; height:36px; text-align:right;}

  .hist-item{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .hist-item .hh{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .hist-item .hnum{font-weight:800; font-size:.95rem;}
  .hist-item .htotal{font-weight:800; color:var(--red);}
  .hist-item .hsub{font-size:.8rem; color:var(--sub); margin:2px 0 8px;}
  .empty-msg{color:var(--sub); font-size:.88rem; text-align:center; padding:30px 10px;}

  #toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); z-index:300; background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:700; font-size:.85rem; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; max-width:90vw; text-align:center;}
  #toast.on{opacity:1; transform:translate(-50%,0);}

  .scrim{position:fixed; inset:0; z-index:200; background:rgba(10,14,20,.55); display:flex; align-items:center; justify-content:center; padding:16px;}
  .sheet{width:min(380px,100%); background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px;}
  .sheet h3{margin:0 0 8px;}
  .sheet p{color:var(--sub); font-size:.88rem; line-height:1.4;}
  .sheet .btn-row{margin-top:14px; justify-content:flex-end;}

  /* ---- Documento imprimible (estilo hoja de cálculo empresarial) ---- */
  .print-only{display:none;}
  #printArea{
    background:#fff; color:#111; width:182mm; margin:0 auto;
    font-family:Arial,Helvetica,sans-serif; font-size:9.5pt; line-height:1.35;
    border-top:3px solid #b3261e;
  }
  #printArea .pd-top{display:flex; justify-content:space-between; align-items:flex-start; padding-top:8mm; margin-bottom:4mm;}
  #printArea .pd-title{font-size:22pt; font-weight:800; letter-spacing:.5px; color:#111; text-transform:uppercase;}
  #printArea .pd-num{font-size:9pt; color:#333; margin-top:2px; font-weight:700;}
  #printArea .pd-logo{height:15mm; object-fit:contain;}
  #printArea .pd-biz{font-size:8pt; text-align:right; line-height:1.6; color:#222; margin-top:2mm;}
  #printArea .pd-biz a{color:#1155cc; text-decoration:underline;}

  #printArea table{width:100%; border-collapse:collapse; table-layout:fixed;}
  #printArea .pd-meta{margin-bottom:4mm;}
  #printArea .pd-meta td, #printArea .pd-meta th{border:1px solid #333; padding:3.5px 7px; font-size:8.5pt; vertical-align:top;}
  #printArea .pd-meta th{text-align:left; font-weight:700; background:#fff;}
  #printArea .pd-meta .pd-client{font-weight:800; font-size:10.5pt; vertical-align:middle;}
  #printArea .pd-meta .pd-client small{display:block; font-weight:400; font-size:7.6pt; color:#333; margin-top:3px;}

  #printArea .pd-items th, #printArea .pd-items td{border:1px solid #333; padding:4px 7px; font-size:8.5pt;}
  #printArea .pd-items thead th{background:#1a1a1a; color:#fff; text-align:left; font-size:8pt; text-transform:uppercase; letter-spacing:.3px;}
  #printArea .pd-items td.num{text-align:right; white-space:nowrap;}
  #printArea .pd-items tr.main td{font-weight:700;}
  #printArea .pd-items tr.main td.pfinal{background:#fff6b0;}
  #printArea .pd-items tr.sub td{color:#333; font-weight:400; font-size:8.3pt;}
  #printArea .pd-items tr.pad td{height:5mm; border-color:#ccc;}

  #printArea .pd-bottom{display:flex; justify-content:space-between; gap:8mm; margin-top:4mm; align-items:flex-start;}
  #printArea .pd-notes{flex:1; font-size:8pt; color:#222; line-height:1.65;}
  #printArea .pd-notes b{color:#000; text-transform:uppercase; font-size:7.8pt; letter-spacing:.3px;}
  #printArea .pd-totals{width:62mm; font-size:9pt; border:1px solid #333;}
  #printArea .pd-totals .tr{display:flex; justify-content:space-between; padding:4px 8px; border-bottom:1px solid #ccc;}
  #printArea .pd-totals .tr.total{border-bottom:none; border-top:2px solid #111; margin-top:0; padding-top:7px; padding-bottom:7px; font-weight:800; font-size:12pt; background:#f4f4f4;}
  #printArea .pd-vig{margin-top:3mm; font-size:7.8pt; color:#444; font-style:italic;}
  #printArea .pd-foot{margin-top:10mm; padding-top:3mm; border-top:1px solid #333; display:flex; justify-content:space-between; align-items:center; font-size:8pt; font-weight:700;}
  #printArea .pd-foot .foot-brand{color:#333;}
  #printArea .pd-foot .foot-web{color:#d8720a;}

  @media print{
    #appRoot{display:none !important;}
    #printArea{display:block !important; width:auto;}
    #toast, #modal-root{display:none !important;}
    body{background:#fff !important;}
    @page{ size:A4 portrait; margin:14mm 12mm; }
  }
</style>
</head>
<body>

<div id="appRoot">
<header class="app">
  <div class="app-top">
    <img id="headerLogo" src="" alt="">
    <h1>Cotizaciones</h1>
  </div>
  <nav class="tabbar">
    <button class="tabbtn" data-view="nueva">🧾 Nueva</button>
    <button class="tabbtn" data-view="historial">📜 Historial</button>
    <button class="tabbtn" data-view="negocio">⚙️ Mi negocio</button>
  </nav>
</header>

<div class="wrap">

  <!-- ===== VISTA: NUEVA COTIZACIÓN ===== -->
  <section class="view" id="view-nueva">
    <div class="card">
      <h2>📋 Datos de la cotización</h2>
      <div class="row2">
        <div class="fld"><label>Número</label><input id="q-numero" disabled></div>
        <div class="fld"><label>Fecha</label><input id="q-fecha" type="date"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Forma de pago</label><input id="q-formapago" placeholder="Contado"></div>
        <div class="fld"><label>Atendido por</label><input id="q-representante" placeholder="Nombre del representante"></div>
      </div>
    </div>

    <div class="card">
      <h2>👤 Cliente</h2>
      <div class="fld"><label>Nombre / Empresa</label><input id="c-nombre" placeholder="Ej. Ibarra Tennis Club"></div>
      <div class="row2">
        <div class="fld"><label>RUC / Cédula</label><input id="c-ruc"></div>
        <div class="fld"><label>Teléfono</label><input id="c-telefono" type="tel"></div>
      </div>
      <div class="fld"><label>Correo</label><input id="c-email" type="email"></div>
      <div class="fld"><label>Dirección de entrega</label><input id="c-direccion"></div>
    </div>

    <div class="card">
      <h2>🧺 Ítems</h2>
      <div id="itemsList"></div>
      <button class="btn block" id="addItemBtn">+ Agregar ítem</button>
    </div>

    <div class="card">
      <h2>💰 Totales</h2>
      <div class="totals">
        <div class="t-row"><span>P. Neto</span><b id="t-neto">$0.00</b></div>
        <div class="t-row"><span>Envío</span><input id="q-envio" type="number" inputmode="decimal" value="0" step="0.01"></div>
        <div class="t-row"><span>Descuento global</span><input id="q-descglobal" type="number" inputmode="decimal" value="0" step="0.01"></div>
        <div class="t-row"><span>IVA (<input id="q-iva" type="number" inputmode="decimal" style="width:52px;height:30px;text-align:center;display:inline-block;" value="15">%)</span><b id="t-iva">$0.00</b></div>
        <div class="t-row total"><span>TOTAL</span><b id="t-total">$0.00</b></div>
      </div>
    </div>

    <div class="card">
      <h2>📝 Notas y condiciones</h2>
      <div class="fld"><textarea id="q-notas" rows="4"></textarea></div>
      <div class="fld"><label>Vigencia de la oferta (días desde la fecha)</label><input id="q-vigencia" type="number" style="max-width:120px;"></div>
    </div>

    <div class="btn-row">
      <button class="btn pri block" id="saveBtn">💾 Guardar</button>
      <button class="btn block" id="pdfBtn">⬇️ Descargar / Compartir PDF</button>
      <button class="btn block" id="newBtn">🆕 Cotización en blanco</button>
    </div>
  </section>

  <!-- ===== VISTA: HISTORIAL ===== -->
  <section class="view" id="view-historial">
    <div class="card" style="margin-bottom:0;">
      <h2>📜 Cotizaciones guardadas</h2>
      <div id="histList"></div>
    </div>
  </section>

  <!-- ===== VISTA: MI NEGOCIO ===== -->
  <section class="view" id="view-negocio">
    <div class="card">
      <h2>⚙️ Datos de tu negocio</h2>
      <p style="font-size:.82rem;color:var(--sub);margin-top:-6px;">Esto aparece en el encabezado de cada cotización y se guarda en este dispositivo.</p>
      <div class="logo-pick">
        <img id="logoPreview" src="" alt="Logo">
        <button class="btn sm" id="logoBtn">Cambiar logo</button>
        <input type="file" id="logoFile" accept="image/*" style="display:none;">
      </div>
      <div class="fld"><label>Nombre del negocio</label><input id="b-nombre"></div>
      <div class="fld"><label>Dirección</label><input id="b-direccion"></div>
      <div class="row2">
        <div class="fld"><label>Teléfono</label><input id="b-telefono"></div>
        <div class="fld"><label>Email</label><input id="b-email" type="email"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>Web</label><input id="b-web"></div>
        <div class="fld"><label>Redes sociales</label><input id="b-redes" placeholder="@usuario"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>RUC / NIT</label><input id="b-ruc"></div>
        <div class="fld"><label>Moneda (símbolo)</label><input id="b-moneda" style="max-width:100px;"></div>
      </div>
      <div class="row2">
        <div class="fld"><label>IVA por defecto (%)</label><input id="b-iva" type="number"></div>
        <div class="fld"><label>Vigencia por defecto (días)</label><input id="b-vigencia" type="number"></div>
      </div>
      <div class="fld"><label>Forma de pago por defecto</label><input id="b-formapago"></div>
      <div class="fld"><label>Notas / condiciones por defecto</label><textarea id="b-notas" rows="4"></textarea></div>
      <button class="btn pri block" id="saveBizBtn">💾 Guardar datos del negocio</button>
    </div>
  </section>

</div>
</div>

<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea" class="print-only"></div>

/* ===================== Utilidades ===================== */
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDateHuman(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+Number(n||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2400); }

/* ===================== Persistencia ===================== */
const BIZ_KEY='kp_business_v1', QUOTES_KEY='kp_quotes_v1', COUNTER_KEY='kp_counter_v1';

function defaultBusiness(){
  return {
    logo: DEFAULT_LOGO,
    nombre:'KEEPER',
    direccion:'Jose Mejía 9-135 - Ibarra, Ecuador',
    telefono:'0969838331',
    email:'news@keeper.com.ec',
    web:'www.keeper.com.ec',
    redes:'@keeper.ecu',
    ruc:'1091708511001',
    moneda:'$',
    ivaPct:15,
    vigenciaDias:8,
    formaPago:'Contado',
    notas:'Forma de pago (60% anticipo, 40% contraentrega o envío courier).\nEntrega 8 días laborables, una vez realizados tallajes y aprobados diseños.\nCondiciones de cambios y garantías, revisar en contrato.'
  };
}
function loadBusiness(){
  try{ const s=localStorage.getItem(BIZ_KEY); if(s){ return Object.assign(defaultBusiness(), JSON.parse(s)); } }catch(e){}
  return defaultBusiness();
}
function saveBusiness(){ try{ localStorage.setItem(BIZ_KEY, JSON.stringify(biz)); }catch(e){} }

function loadQuotes(){ try{ const s=localStorage.getItem(QUOTES_KEY); return s?JSON.parse(s):[]; }catch(e){ return []; } }
function saveQuotes(){ try{ localStorage.setItem(QUOTES_KEY, JSON.stringify(quotes)); }catch(e){} }
function nextCounter(){
  let n = 1;
  try{ n = parseInt(localStorage.getItem(COUNTER_KEY)||'0',10) + 1; }catch(e){}
  try{ localStorage.setItem(COUNTER_KEY, String(n)); }catch(e){}
  return n;
}

let biz = loadBusiness();
let quotes = loadQuotes();

function mkItem(){ return {id:uid(), codigo:'', descripcion:'', cantidad:1, precioUni:0, descuento:0}; }
function newQuote(){
  return {
    id: uid(), numero: null,
    fecha: todayISO(),
    formaPago: biz.formaPago,
    representante: '',
    cliente: {nombre:'', ruc:'', telefono:'', email:'', direccion:''},
    items: [mkItem()],
    envio: 0, descuentoGlobal: 0, ivaPct: biz.ivaPct,
    notas: biz.notas, vigenciaDias: biz.vigenciaDias
  };
}
let current = newQuote();

/* ===================== Tabs ===================== */
const views = ['nueva','historial','negocio'];
function showView(v){
  views.forEach(x=>{
    document.getElementById('view-'+x).classList.toggle('on', x===v);
  });
  document.querySelectorAll('.tabbtn').forEach(b=> b.classList.toggle('on', b.dataset.view===v));
  if(v==='historial') renderHistorial();
}
document.querySelectorAll('.tabbtn').forEach(b=> b.addEventListener('click', ()=> showView(b.dataset.view)));

/* ===================== Render: formulario de ítems ===================== */
const itemsList = document.getElementById('itemsList');
function renderItems(){
  itemsList.innerHTML = current.items.map((it,i)=>{
    const final = num(it.precioUni) - num(it.descuento);
    const total = final * num(it.cantidad);
    return `<div class="item-card" data-id="${it.id}">
      <div class="item-head"><b>Ítem ${i+1}</b>${current.items.length>1?`<button class="item-del" data-act="delitem" data-id="${it.id}" aria-label="Eliminar ítem">×</button>`:''}</div>
      <div class="item-grid">
        <div class="fld full"><label>Descripción</label><textarea data-f="descripcion" rows="2" placeholder="Ej. Camiseta POLO Sublimada">${esc(it.descripcion)}</textarea></div>
        <div class="fld"><label>Código</label><input data-f="codigo" value="${esc(it.codigo)}"></div>
        <div class="fld"><label>Cantidad</label><input data-f="cantidad" type="number" inputmode="decimal" value="${it.cantidad}"></div>
        <div class="fld"><label>Precio unitario</label><input data-f="precioUni" type="number" inputmode="decimal" step="0.01" value="${it.precioUni}"></div>
        <div class="fld"><label>Descuento (por unidad)</label><input data-f="descuento" type="number" inputmode="decimal" step="0.01" value="${it.descuento}"></div>
      </div>
      <div class="item-total">${biz.moneda}${total.toFixed(2)}</div>
    </div>`;
  }).join('');
  computeTotals();
}
itemsList.addEventListener('input', e=>{
  const card = e.target.closest('.item-card'); if(!card) return;
  const it = current.items.find(x=>x.id===card.dataset.id); if(!it) return;
  const f = e.target.dataset.f; if(!f) return;
  it[f] = (f==='descripcion'||f==='codigo') ? e.target.value : num(e.target.value);
  const total = (num(it.precioUni)-num(it.descuento)) * num(it.cantidad);
  card.querySelector('.item-total').textContent = biz.moneda + total.toFixed(2);
  computeTotals();
});
itemsList.addEventListener('click', e=>{
  const b = e.target.closest('[data-act="delitem"]'); if(!b) return;
  current.items = current.items.filter(x=>x.id!==b.dataset.id);
  renderItems();
});
document.getElementById('addItemBtn').addEventListener('click', ()=>{
  current.items.push(mkItem());
  renderItems();
});

/* ===================== Totales ===================== */
function computeTotals(){
  const neto = current.items.reduce((s,it)=> s + (num(it.precioUni)-num(it.descuento))*num(it.cantidad), 0);
  const envio = num(document.getElementById('q-envio').value);
  const descG = num(document.getElementById('q-descglobal').value);
  const ivaPct = num(document.getElementById('q-iva').value);
  const base = neto + envio - descG;
  const iva = base * ivaPct/100;
  const total = base + iva;
  document.getElementById('t-neto').textContent = biz.moneda + neto.toFixed(2);
  document.getElementById('t-iva').textContent = biz.moneda + iva.toFixed(2);
  document.getElementById('t-total').textContent = biz.moneda + total.toFixed(2);
  return {neto, envio, descG, ivaPct, iva, total};
}
['q-envio','q-descglobal','q-iva'].forEach(id=> document.getElementById(id).addEventListener('input', computeTotals));

/* ===================== Formulario: cargar / leer ===================== */
function loadFormFromCurrent(){
  document.getElementById('q-numero').value = current.numero || 'Borrador (sin guardar)';
  document.getElementById('q-fecha').value = current.fecha;
  document.getElementById('q-formapago').value = current.formaPago;
  document.getElementById('q-representante').value = current.representante;
  document.getElementById('c-nombre').value = current.cliente.nombre;
  document.getElementById('c-ruc').value = current.cliente.ruc;
  document.getElementById('c-telefono').value = current.cliente.telefono;
  document.getElementById('c-email').value = current.cliente.email;
  document.getElementById('c-direccion').value = current.cliente.direccion;
  document.getElementById('q-envio').value = current.envio;
  document.getElementById('q-descglobal').value = current.descuentoGlobal;
  document.getElementById('q-iva').value = current.ivaPct;
  document.getElementById('q-notas').value = current.notas;
  document.getElementById('q-vigencia').value = current.vigenciaDias;
  renderItems();
}
function readFormIntoCurrent(){
  current.fecha = document.getElementById('q-fecha').value || todayISO();
  current.formaPago = document.getElementById('q-formapago').value;
  current.representante = document.getElementById('q-representante').value;
  current.cliente = {
    nombre: document.getElementById('c-nombre').value,
    ruc: document.getElementById('c-ruc').value,
    telefono: document.getElementById('c-telefono').value,
    email: document.getElementById('c-email').value,
    direccion: document.getElementById('c-direccion').value
  };
  current.envio = num(document.getElementById('q-envio').value);
  current.descuentoGlobal = num(document.getElementById('q-descglobal').value);
  current.ivaPct = num(document.getElementById('q-iva').value);
  current.notas = document.getElementById('q-notas').value;
  current.vigenciaDias = num(document.getElementById('q-vigencia').value);
}

/* ===================== Guardar / Nueva ===================== */
document.getElementById('saveBtn').addEventListener('click', ()=>{
  readFormIntoCurrent();
  if(!current.cliente.nombre.trim()){ toast('Falta el nombre del cliente'); return; }
  if(!current.items.some(it=>it.descripcion.trim())){ toast('Agrega al menos un ítem con descripción'); return; }
  if(!current.numero){ current.numero = 'COT-' + String(nextCounter()).padStart(4,'0'); }
  const idx = quotes.findIndex(q=>q.id===current.id);
  const snapshot = JSON.parse(JSON.stringify(current));
  if(idx>=0) quotes[idx] = snapshot; else quotes.unshift(snapshot);
  saveQuotes();
  document.getElementById('q-numero').value = current.numero;
  toast('Guardada como ' + current.numero);
});
document.getElementById('newBtn').addEventListener('click', ()=>{
  if(!confirm('¿Empezar una cotización en blanco? Si no guardaste la actual, se pierde.')) return;
  current = newQuote();
  loadFormFromCurrent();
  toast('Cotización en blanco lista');
});

/* ===================== Historial ===================== */
const histList = document.getElementById('histList');
function renderHistorial(){
  if(!quotes.length){ histList.innerHTML = '<p class="empty-msg">Todavía no guardaste ninguna cotización.</p>'; return; }
  histList.innerHTML = quotes.map(q=>{
    const neto = q.items.reduce((s,it)=> s + (num(it.precioUni)-num(it.descuento))*num(it.cantidad), 0);
    const base = neto + num(q.envio) - num(q.descuentoGlobal);
    const total = base + base*num(q.ivaPct)/100;
    return `<div class="hist-item">
      <div class="hh"><span class="hnum">${esc(q.numero)}</span><span class="htotal">${biz.moneda}${total.toFixed(2)}</span></div>
      <div class="hsub">${esc(q.cliente.nombre||'Sin cliente')} · ${fmtDateHuman(q.fecha)}</div>
      <div class="btn-row">
        <button class="btn sm" data-act="open" data-id="${q.id}">Abrir / editar</button>
        <button class="btn sm" data-act="pdf" data-id="${q.id}">PDF</button>
        <button class="btn sm danger" data-act="del" data-id="${q.id}">Eliminar</button>
      </div>
    </div>`;
  }).join('');
}
histList.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const q = quotes.find(x=>x.id===b.dataset.id); if(!q) return;
  if(b.dataset.act==='open'){
    current = JSON.parse(JSON.stringify(q));
    loadFormFromCurrent();
    showView('nueva');
  } else if(b.dataset.act==='pdf'){
    printQuote(q);
  } else if(b.dataset.act==='del'){
    if(!confirm('¿Eliminar la cotización ' + q.numero + '? No se puede deshacer.')) return;
    quotes = quotes.filter(x=>x.id!==q.id);
    saveQuotes();
    renderHistorial();
  }
});

/* ===================== Datos del negocio ===================== */
function loadBizForm(){
  document.getElementById('logoPreview').src = biz.logo;
  document.getElementById('headerLogo').src = biz.logo;
  document.getElementById('b-nombre').value = biz.nombre;
  document.getElementById('b-direccion').value = biz.direccion;
  document.getElementById('b-telefono').value = biz.telefono;
  document.getElementById('b-email').value = biz.email;
  document.getElementById('b-web').value = biz.web;
  document.getElementById('b-redes').value = biz.redes;
  document.getElementById('b-ruc').value = biz.ruc;
  document.getElementById('b-moneda').value = biz.moneda;
  document.getElementById('b-iva').value = biz.ivaPct;
  document.getElementById('b-vigencia').value = biz.vigenciaDias;
  document.getElementById('b-formapago').value = biz.formaPago;
  document.getElementById('b-notas').value = biz.notas;
}
document.getElementById('logoBtn').addEventListener('click', ()=> document.getElementById('logoFile').click());
document.getElementById('logoFile').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    document.getElementById('logoPreview').src = reader.result;
  };
  reader.readAsDataURL(file);
});
document.getElementById('saveBizBtn').addEventListener('click', ()=>{
  biz.logo = document.getElementById('logoPreview').src;
  biz.nombre = document.getElementById('b-nombre').value;
  biz.direccion = document.getElementById('b-direccion').value;
  biz.telefono = document.getElementById('b-telefono').value;
  biz.email = document.getElementById('b-email').value;
  biz.web = document.getElementById('b-web').value;
  biz.redes = document.getElementById('b-redes').value;
  biz.ruc = document.getElementById('b-ruc').value;
  biz.moneda = document.getElementById('b-moneda').value || '$';
  biz.ivaPct = num(document.getElementById('b-iva').value);
  biz.vigenciaDias = num(document.getElementById('b-vigencia').value);
  biz.formaPago = document.getElementById('b-formapago').value;
  biz.notas = document.getElementById('b-notas').value;
  saveBusiness();
  document.getElementById('headerLogo').src = biz.logo;
  toast('Datos del negocio guardados');
});

/* ===================== PDF / impresión ===================== */
function printQuote(q){
  const neto = q.items.reduce((s,it)=> s + (num(it.precioUni)-num(it.descuento))*num(it.cantidad), 0);
  const base = neto + num(q.envio) - num(q.descuentoGlobal);
  const iva = base * num(q.ivaPct)/100;
  const total = base + iva;
  const vigFecha = q.vigenciaDias ? addDays(q.fecha, q.vigenciaDias) : '';

  const itemsRows = q.items.map(it=>{
    const final = num(it.precioUni) - num(it.descuento);
    const t = final * num(it.cantidad);
    const lines = String(it.descripcion||'').split('\n');
    const mainLine = lines[0] || '';
    const subLines = lines.slice(1).filter(l=>l.trim());
    let rows = `<tr class="main">
      <td>${esc(it.codigo)}</td>
      <td>${esc(mainLine)}</td>
      <td class="num">${it.cantidad}</td>
      <td class="num">${biz.moneda}${num(it.precioUni).toFixed(2)}</td>
      <td class="num">${biz.moneda}${num(it.descuento).toFixed(2)}</td>
      <td class="num pfinal">${biz.moneda}${final.toFixed(2)}</td>
      <td class="num">${biz.moneda}${t.toFixed(2)}</td>
    </tr>`;
    subLines.forEach(l=>{
      rows += `<tr class="sub"><td></td><td colspan="6">${esc(l)}</td></tr>`;
    });
    return rows;
  }).join('');
  const padRows = Array.from({length:3}).map(()=>'<tr class="pad"><td colspan="7"></td></tr>').join('');

  const clienteBits = [
    q.cliente.ruc ? 'RUC/CI: '+esc(q.cliente.ruc) : '',
    q.cliente.telefono ? esc(q.cliente.telefono) : '',
    q.cliente.email ? esc(q.cliente.email) : ''
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');

  document.getElementById('printArea').innerHTML = `
    <div class="pd-top">
      <div>
        <div class="pd-title">Cotización</div>
        <div class="pd-num">N.° ${esc(q.numero||'Borrador')}</div>
      </div>
      <div>
        <img class="pd-logo" src="${biz.logo}">
        <div class="pd-biz">
          ${esc(biz.direccion)}<br>
          Telf: ${esc(biz.telefono)}<br>
          <a>${esc(biz.email)}</a> &nbsp;·&nbsp; <a>${esc(biz.web)}</a>
        </div>
      </div>
    </div>
    <table class="pd-meta">
      <tr>
        <th style="width:16%">Fecha</th><th style="width:19%">Forma de pago</th><th style="width:19%">Atendido por</th>
        <th rowspan="2" class="pd-client">${esc(q.cliente.nombre || 'Cliente')}${clienteBits? '<small>'+clienteBits+'</small>':''}${q.cliente.direccion?'<small>Entrega: '+esc(q.cliente.direccion)+'</small>':''}</th>
      </tr>
      <tr>
        <td>${fmtDateHuman(q.fecha)}</td><td>${esc(q.formaPago)}</td><td>${esc(q.representante)}</td>
      </tr>
    </table>
    <table class="pd-items">
      <thead><tr><th style="width:9%">Código</th><th>Descripción</th><th style="width:8%">Cant.</th><th style="width:11%">P. Uni.</th><th style="width:10%">Desc.</th><th style="width:11%">P. Final</th><th style="width:12%">Total</th></tr></thead>
      <tbody>${itemsRows}${padRows}</tbody>
    </table>
    <div class="pd-bottom">
      <div class="pd-notes">
        ${q.notas? '<b>Notas y condiciones</b><br>'+nl2br(q.notas) : ''}
        ${vigFecha? `<div class="pd-vig">Vigencia de la oferta: válida ${q.vigenciaDias} días desde su emisión (hasta ${fmtDateHuman(vigFecha)}).</div>` : ''}
      </div>
      <div class="pd-totals">
        <div class="tr"><span>P. Neto</span><span>${biz.moneda}${neto.toFixed(2)}</span></div>
        <div class="tr"><span>Envío</span><span>${biz.moneda}${num(q.envio).toFixed(2)}</span></div>
        <div class="tr"><span>Descuento</span><span>${biz.moneda}${num(q.descuentoGlobal).toFixed(2)}</span></div>
        <div class="tr"><span>IVA (${num(q.ivaPct)}%)</span><span>${biz.moneda}${iva.toFixed(2)}</span></div>
        <div class="tr total"><span>TOTAL</span><span>${biz.moneda}${total.toFixed(2)}</span></div>
      </div>
    </div>
    <div class="pd-foot">
      <span class="foot-brand">${esc(biz.nombre)}${biz.ruc? ' · RUC '+esc(biz.ruc):''} ${biz.redes? ' · '+esc(biz.redes):''}</span>
      <span class="foot-web">${esc(biz.web)}</span>
    </div>
  `;
  document.title = 'Cotizacion_' + (q.numero||'borrador');
  setTimeout(()=> window.print(), 80);
}
document.getElementById('pdfBtn').addEventListener('click', ()=>{
  readFormIntoCurrent();
  if(!current.numero){
    if(!confirm('Esta cotización no se ha guardado (no tiene número). ¿Generar el PDF igual como borrador?')) return;
  }
  printQuote(current);
});

/* ===================== Init ===================== */
loadBizForm();
loadFormFromCurrent();
showView('nueva');
</script>

</body>
